<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Dom Projects</title>
    <style>
        .subscribe-btn {
            border: none;
            background-color: black;
            color: white;
            padding: 10px 15px 10px 15px;
            border-radius: 10%;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .is_subscribed {
            background-color: rgb(240,240,240);
            color : black;
        }

        body {
            font-family: Arial;
        }

        .calculate_btn {
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }

        .js-input {
           font-size: 15px;
           padding: 10px;
        }
    </style>
</head>


<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="subscribe()" class = "js-btn subscribe-btn">Subscribe</button>

<p>Amazon Shipping Calculator</p>
<input class="js-input" placeholder="cost of order" onkeydown="calculateEventKey(event)"/>
<button class = "calculate_btn" onclick="amazonShippingCalculator()">Calculate</button>
<p class="js-amazon-cost"></p>

</body>






<script>

    function calculateEventKey(event){
        if(event.key === 'Enter'){
           amazonShippingCalculator();
        }
    }

    function amazonShippingCalculator(){
        const inputElement = document.querySelector(".js-input");
        let cost = Number(inputElement.value);
        

        if(cost < 100){
            cost = cost + 10;
        }
        
        document.querySelector(".js-amazon-cost").innerHTML = `${cost}/-`;
    }
   
    function subscribe(){
     const buttonElement = document.querySelector('.js-btn');
    
    if(buttonElement.innerText === 'Subscribe'){
        buttonElement.innerHTML = 'Subscribed'
        buttonElement.classList.add("is_subscribed");
    }
    else {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove("is_subscribed");
    }
    
    }
</script>
</html>
