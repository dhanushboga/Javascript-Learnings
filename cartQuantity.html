<!DOCTYPE html>
<head>
<style>
    .btn {
        color: red;
         background-color: blue;
         text-align: center;
         padding: 20px 50px;
         border-radius: 5px;
        font-size: 16px;
        font-weight: 700;
    }

    .btn1 {
        color: blue;
        background-color: yellow;
         text-align: center;
         padding: 20px 50px;
         border-radius: 5px;
        font-size: 16px;
        font-weight: 700;
    }

    .btn2 {
        color: green;
        background-color: red;
         text-align: center;
         padding: 20px 50px;
         border-radius: 5px;
        font-size: 16px;
        font-weight: 700;
    }

    .btn3 {
        color: red;
        background-color: black;
         text-align: center;
         padding: 20px 50px;
         border-radius: 5px;
        font-size: 16px;
        font-weight: 700;
    }

     .btn4 {
        color: orange;
         background-color: green;
         text-align: center;
         padding: 20px 50px;
         border-radius: 5px;
        font-size: 16px;
        font-weight: 700;
    }
</style>

</head>

<body>
    <p id = "demo">Total Quantity:</p>
    <p id = "demo1">Add to Cart:</p>
    <p id = "demo2">Plus2:</p>
    <p id = "demo3">Plus3:</p>
    
    <button class = "btn" onclick="showQuantity();">Show Quantity</button>
    <button class = "btn1" onclick="AddToCart();">Add to Cart</button>
    <button class = "btn2" onclick="plus2();">+2</button>
    <button class = "btn3" onclick="plus3();">+3</button>
    <button class = "btn4" onclick="resetButton();">Reset Cart</button>

    <script>
     let quantity = 0;

     function showQuantity(){

        document.getElementById("demo").innerHTML = `Total Quantity: ${quantity}`;
        
     }

     function AddToCart(){
        quantity ++;
        document.getElementById("demo1").innerHTML = `Add to Cart: ${quantity}`;

     }

     function plus2(){
        quantity +=2;
        document.getElementById("demo2").innerHTML = `Plus2: ${quantity}`;
     }

     function plus3(){
        quantity +=3;
        document.getElementById("demo3").innerHTML = `Plus3: ${quantity}`;
     }


     function resetButton(){
        quantity = 0;
        
        
     }
    </script>

</body>

</html>
