<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arrays Learnings</title>
</head>
<body>

    <script>
        const myarray = [1,2,3,4,5];
        console.log(myarray);


        console.log(myarray[2]);
        myarray[2] = 7;
        console.log(myarray);
        
        myarray.push(10);
        console.log(myarray);

        myarray.splice(0,2);
        console.log(myarray);

        console.log(myarray.length);

    </script>
    
</body>
</html>
